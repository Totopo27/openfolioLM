<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFolioLM · Arquitectura Hexagonal</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame {
      max-width: 1100px;
      width: 100%;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 2.8vw + 0.8rem, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container {
      background: var(--color-paper);
      border: 1px solid rgba(45, 49, 66, 0.12);
      border-radius: 8px;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura Hexagonal · Diagram Design</p>
    <h1>OpenFolioLM — Estación de Síntesis en Dominio Cerrado</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
        <title id="arch-title">Arquitectura Hexagonal de OpenFolioLM</title>
        <desc id="arch-desc">Diagrama editorial de arquitectura hexagonal (puertos y adaptadores) para OpenFolioLM siguiendo las especificaciones de Diagram Design.</desc>

        <defs>
          <style>
            .eyebrow-svg { font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; fill: #4f5d75; }
            .title-svg { font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; font-weight: 400; fill: #2d3142; }
            .node-name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
            .sublabel { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; }
            .tag { font-family: 'Geist Mono', monospace; font-size: 7px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; }
            .arrow-lbl { font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.08em; }
          </style>

          <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.8" fill="rgba(45,49,66,0.12)" />
          </pattern>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36" />
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />
          </marker>
        </defs>

        <!-- Canvas Background -->
        <rect width="100%" height="100%" fill="#f5f5f5" />
        <rect width="100%" height="100%" fill="url(#grid-dots)" opacity="0.65" />

        <!-- Header Section -->
        <text x="40" y="38" class="eyebrow-svg">ARQUITECTURA DEL SISTEMA · PUERTOS Y ADAPTADORES</text>
        <text x="40" y="66" class="title-svg">OpenFolioLM — Estación de Síntesis en Dominio Cerrado</text>

        <!-- Connectors Layer (Z-Order: Behind Nodes) -->
        <line x1="280" y1="130" x2="348" y2="130" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" />
        <line x1="470" y1="162" x2="470" y2="204" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arrow-accent)" />
        <line x1="180" y1="316" x2="180" y2="342" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <line x1="520" y1="316" x2="520" y2="342" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <line x1="860" y1="316" x2="860" y2="342" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <line x1="180" y1="384" x2="180" y2="410" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <line x1="520" y1="384" x2="520" y2="410" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
        <line x1="860" y1="384" x2="860" y2="410" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />

        <!-- Arrow Labels with Masking Rects -->
        <rect x="290" y="122" width="46" height="15" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.7" />
        <text x="313" y="133" class="arrow-lbl" fill="#2e5aa8" text-anchor="middle">REST/SSE</text>

        <rect x="444" y="174" width="52" height="15" rx="2" fill="#f5f5f5" stroke="rgba(235,108,54,0.30)" stroke-width="0.7" />
        <text x="470" y="185" class="arrow-lbl" fill="#eb6c36" text-anchor="middle">STREAM</text>

        <!-- ==================== TIER 1: CLIENTES & GATEWAY ==================== -->
        <rect x="40" y="98" width="240" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
        <rect x="48" y="106" width="34" height="13" rx="2" fill="transparent" stroke="#7a8399" stroke-width="0.8" />
        <text x="65" y="116" class="tag" fill="#4f5d75" text-anchor="middle">CLIENT</text>
        <text x="145" y="127" class="node-name" text-anchor="middle">Frontend Paper &amp; Ink</text>
        <text x="145" y="145" class="sublabel" text-anchor="middle">React 18 · Vite · Tailwind CSS</text>

        <rect x="350" y="98" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <rect x="358" y="106" width="44" height="13" rx="2" fill="transparent" stroke="#7a8399" stroke-width="0.8" />
        <text x="380" y="116" class="tag" fill="#4f5d75" text-anchor="middle">GATEWAY</text>
        <text x="470" y="127" class="node-name" text-anchor="middle">FastAPI Application</text>
        <text x="470" y="145" class="sublabel" text-anchor="middle">Async Engine · SSE Streaming</text>

        <rect x="690" y="98" width="310" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)" stroke-dasharray="4,3" stroke-width="0.9" />
        <text x="704" y="118" class="tag" fill="#4f5d75">PRINCIPIO ARQUITECTÓNICO</text>
        <text x="704" y="135" class="node-name" font-size="11">Desacoplamiento Estricto</text>
        <text x="704" y="149" class="sublabel">El dominio no conoce a la UI ni a la BD</text>

        <!-- ==================== TIER 2: HEXAGONAL CORE (FOCAL) ==================== -->
        <rect x="40" y="206" width="960" height="110" rx="8" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4" />

        <rect x="52" y="214" width="220" height="15" rx="2" fill="#f5f5f5" stroke="#eb6c36" stroke-width="0.8" />
        <text x="162" y="225" class="tag" fill="#eb6c36" text-anchor="middle">NÚCLEO HEXAGONAL · DOMINIO CENTRAL</text>

        <rect x="56" y="240" width="280" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1" />
        <text x="70" y="258" class="tag" fill="#eb6c36">OFFSETS &amp; HIERARCHY</text>
        <text x="70" y="275" class="node-name">Positional Chunker</text>
        <text x="70" y="291" class="sublabel">start_char, end_char, pág, título</text>

        <rect x="380" y="240" width="280" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1" />
        <text x="394" y="258" class="tag" fill="#eb6c36">ZERO-HALLUCINATION</text>
        <text x="394" y="275" class="node-name">Closed-Domain Synthesizer</text>
        <text x="394" y="291" class="sublabel">Grounding estricto + Citas [^n]</text>

        <rect x="704" y="240" width="280" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1" />
        <text x="718" y="258" class="tag" fill="#eb6c36">INFERENCIA LÓGICA</text>
        <text x="718" y="275" class="node-name">NLI Factuality Verifier</text>
        <text x="718" y="291" class="sublabel">Score porcentual de evidencia</text>

        <!-- ==================== TIER 3: PUERTOS DEL DOMINIO ==================== -->
        <rect x="40" y="344" width="280" height="40" rx="5" fill="#ececec" stroke="#4f5d75" stroke-width="1" />
        <text x="52" y="357" class="tag" fill="#4f5d75">PORT</text>
        <text x="180" y="369" class="node-name" text-anchor="middle">Puerto de Ingesta</text>

        <rect x="380" y="344" width="280" height="40" rx="5" fill="#ececec" stroke="#4f5d75" stroke-width="1" />
        <text x="392" y="357" class="tag" fill="#4f5d75">PORT</text>
        <text x="520" y="369" class="node-name" text-anchor="middle">Puerto de Recuperación</text>

        <rect x="720" y="344" width="280" height="40" rx="5" fill="#ececec" stroke="#4f5d75" stroke-width="1" />
        <text x="732" y="357" class="tag" fill="#4f5d75">PORT</text>
        <text x="860" y="369" class="node-name" text-anchor="middle">Puerto de Síntesis &amp; LLM</text>

        <!-- ==================== TIER 4: ADAPTADORES DE INFRAESTRUCTURA ==================== -->
        <rect x="40" y="412" width="280" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <rect x="48" y="420" width="54" height="13" rx="2" fill="transparent" stroke="#7a8399" stroke-width="0.8" />
        <text x="75" y="430" class="tag" fill="#4f5d75" text-anchor="middle">ADAPTER</text>
        <text x="48" y="452" class="node-name">MarkItDown &amp; Multi-Source</text>
        <text x="48" y="470" class="sublabel">PDF, DOCX, XLSX, TXT, Markdown</text>
        <text x="48" y="486" class="sublabel">YouTube Timestamps · ArXiv Papers</text>

        <rect x="380" y="412" width="280" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <rect x="388" y="420" width="54" height="13" rx="2" fill="transparent" stroke="#7a8399" stroke-width="0.8" />
        <text x="415" y="430" class="tag" fill="#4f5d75" text-anchor="middle">ADAPTER</text>
        <text x="388" y="452" class="node-name">SQLite FTS5 + Vector + Rerank</text>
        <text x="388" y="470" class="sublabel">BM25 Léxico + Embeddings Densos</text>
        <text x="388" y="486" class="sublabel">FlashRank ONNX en CPU local</text>

        <rect x="720" y="412" width="280" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" />
        <rect x="728" y="420" width="54" height="13" rx="2" fill="transparent" stroke="#7a8399" stroke-width="0.8" />
        <text x="755" y="430" class="tag" fill="#4f5d75" text-anchor="middle">ADAPTER</text>
        <text x="728" y="452" class="node-name">LLM Clients &amp; Observability</text>
        <text x="728" y="470" class="sublabel">Google Gemini · Ollama · LM Studio</text>
        <text x="728" y="486" class="sublabel">Health Ping Reactivo (Latencia real)</text>
      </svg>
    </div>
  </div>
</body>
</html>
